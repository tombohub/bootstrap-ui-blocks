<nav class="navbar">
    <div class="container-fluid">
        <a href="#HOME" class="navbar-brand">Home</a>
        <button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#offcanvas-navbar">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
<div class="offcanvas offcanvas-end" id="offcanvas-navbar">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Navigation</h5>
        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0 h-100 d-flex flex-column">

        <!-- TOP -->
        <div class="list-group list-group-flush flex-grow-1">
            <a class="list-group-item list-group-item-action" href="#TOP_LINK">Top link</a>
        </div>

        <!-- BOTTOM -->
        <div class="list-group list-group-flush">
            <a href="#HOME" class="list-group-item list-group-item-action">Home</a>
            {% if current_user.is_authenticated %}
            <form action="#LOGOUT_URL" method="post">
                <button class="list-group-item list-group-item-action w-100 text-start">Logout</button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
